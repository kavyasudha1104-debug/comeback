<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>8. After Prelims</title><rect width="390" height="844" fill="#F7F7F5"/><rect x="20" y="28" width="111.19999999999999" height="22" rx="11" fill="#E7F1EB"/><text x="30" y="43" font-family="Inter" font-size="11" font-weight="600" fill="#1F4D38" text-anchor="start" letter-spacing="0.5">PRELIMS DONE</text><text x="20" y="90" font-family="Inter" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="start">Your parked subjects</text><text x="20" y="124" font-family="Inter" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="start">are back.</text><text x="20" y="150" font-family="Inter" font-size="15" font-weight="400" fill="#4A4A4A" text-anchor="start">Ethics and World History waited for Prelims.</text><text x="20" y="172" font-family="Inter" font-size="15" font-weight="400" fill="#4A4A4A" text-anchor="start">Now they're first in line for Mains.</text><rect x="20" y="200" width="350" height="170" rx="16" fill="#FFFFFF"/><circle cx="46" cy="240" r="14" fill="#E7F1EB"/><path d="M40 240 l4 4 l8 -8" fill="none" stroke="#2E6B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="236" font-family="Inter" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">Ethics</text><text x="72" y="256" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">12 units · Mains</text><rect x="36" y="280" width="318" height="1" rx="0" fill="#ECECE8"/><circle cx="46" cy="316" r="14" fill="#E7F1EB"/><path d="M40 316 l4 4 l8 -8" fill="none" stroke="#2E6B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="312" font-family="Inter" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">World History</text><text x="72" y="332" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">11 units · Mains</text><rect x="20" y="384" width="350" height="96" rx="16" fill="#E7F1EB"/><text x="36" y="412" font-family="Inter" font-size="16" font-weight="700" fill="#1F4D38" text-anchor="start">New finish line: Mains</text><text x="36" y="436" font-family="Inter" font-size="14" font-weight="400" fill="#1F4D38" text-anchor="start">Same rules, new date. It will tell you if</text><text x="36" y="456" font-family="Inter" font-size="14" font-weight="400" fill="#1F4D38" text-anchor="start">you're on track for Mains too.</text><rect x="20" y="772" width="350" height="52" rx="12" fill="#2E6B4F"/><text x="195.0" y="803.5" font-family="Inter" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Set my Mains date</text></svg>