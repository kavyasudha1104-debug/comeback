<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>4. You kept Ethics: the trade-off</title><rect width="390" height="844" fill="#F7F7F5"/><circle cx="42" cy="42" r="22" fill="#FFFFFF"/><path d="M45 36 L39 42 L45 48" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="48" font-family="Inter" font-size="19" font-weight="600" fill="#1A1A1A" text-anchor="start">Fit the syllabus before Prelims</text><rect x="20" y="80" width="350" height="96" rx="16" fill="#FFFFFF"/><text x="36" y="110" font-family="Inter" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">Ethics · 12 units</text><rect x="240" y="92" width="114" height="34" rx="10" fill="#F0F0EC"/><rect x="243" y="95" width="52" height="28" rx="8" fill="#FFFFFF"/><text x="269" y="114" font-family="Inter" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Keep</text><text x="326" y="114" font-family="Inter" font-size="13" font-weight="400" fill="#4A4A4A" text-anchor="middle">Park</text><text x="36" y="150" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">You chose to keep it. Your call.</text><rect x="20" y="190" width="350" height="330" rx="16" fill="#FFFFFF" stroke="#E8C98A" stroke-width="1.5"/><rect x="36" y="208" width="111.19999999999999" height="22" rx="11" fill="#FBEFD6"/><text x="46" y="223" font-family="Inter" font-size="11" font-weight="600" fill="#8A5A00" text-anchor="start" letter-spacing="0.5">RECALCULATED</text><text x="36" y="252" font-family="Inter" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">To keep Ethics, these Mains-only subjects</text><text x="36" y="273" font-family="Inter" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">wait until after Prelims instead:</text><text x="36" y="318" font-family="Inter" font-size="14" font-weight="400" fill="#4A4A4A" text-anchor="start">World History</text><text x="250" y="318" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="end">11 units</text><rect x="36" y="332" width="318" height="1" rx="0" fill="#ECECE8"/><text x="36" y="362" font-family="Inter" font-size="14" font-weight="600" fill="#1A1A1A" text-anchor="start">Internal Security</text><text x="250" y="362" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="end">6 units</text><rect x="268" y="348" width="86" height="20" rx="10" fill="#FBEFD6"/><text x="311" y="362" font-family="Inter" font-size="11" font-weight="600" fill="#8A5A00" text-anchor="middle">Added</text><rect x="36" y="376" width="318" height="1" rx="0" fill="#ECECE8"/><text x="36" y="406" font-family="Inter" font-size="14" font-weight="600" fill="#1A1A1A" text-anchor="start">Governance</text><text x="250" y="406" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="end">5 units</text><rect x="268" y="392" width="86" height="20" rx="10" fill="#FBEFD6"/><text x="311" y="406" font-family="Inter" font-size="11" font-weight="600" fill="#8A5A00" text-anchor="middle">Added</text><rect x="36" y="420" width="318" height="1" rx="0" fill="#ECECE8"/><text x="36" y="450" font-family="Inter" font-size="14" font-weight="600" fill="#1A1A1A" text-anchor="start">Disaster Management</text><text x="250" y="450" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="end">4 units</text><rect x="268" y="436" width="86" height="20" rx="10" fill="#FBEFD6"/><text x="311" y="450" font-family="Inter" font-size="11" font-weight="600" fill="#8A5A00" text-anchor="middle">Added</text><rect x="36" y="464" width="318" height="1" rx="0" fill="#ECECE8"/><text x="36" y="492" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">26 units wait instead of 23.</text><rect x="20" y="534" width="350" height="76" rx="16" fill="#E7F1EB"/><text x="36" y="562" font-family="Inter" font-size="16" font-weight="700" fill="#1F4D38" text-anchor="start">Still fits before revision starts</text><text x="36" y="586" font-family="Inter" font-size="14" font-weight="400" fill="#1F4D38" text-anchor="start">Every trade-off is shown before you apply.</text><rect x="20" y="742" width="350" height="52" rx="12" fill="#2E6B4F"/><text x="195.0" y="773.5" font-family="Inter" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Apply this plan</text><text x="195" y="820" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="middle">Or undo and park Ethics instead.</text></svg>