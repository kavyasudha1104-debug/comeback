<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>3. Behind: the plan</title><rect width="390" height="844" fill="#F7F7F5"/><circle cx="42" cy="42" r="22" fill="#FFFFFF"/><path d="M45 36 L39 42 L45 48" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="48" font-family="Inter" font-size="19" font-weight="600" fill="#1A1A1A" text-anchor="start">Fit the syllabus before Prelims</text><rect x="20" y="80" width="350" height="112" rx="16" fill="#FFFFFF"/><text x="36" y="106" font-family="Inter" font-size="12" font-weight="600" fill="#5C5C5C" text-anchor="start" letter-spacing="0.5">STEP 1 · SMALLEST CHANGE</text><text x="36" y="130" font-family="Inter" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="start">Study a little more each week</text><text x="36" y="154" font-family="Inter" font-size="14" font-weight="400" fill="#4A4A4A" text-anchor="start">Up to 2 units a day (your 30% catch-up limit).</text><text x="36" y="174" font-family="Inter" font-size="14" font-weight="400" fill="#4A4A4A" text-anchor="start">Not enough on its own: 23 units still don't fit.</text><rect x="20" y="206" width="350" height="286" rx="16" fill="#FFFFFF"/><text x="36" y="232" font-family="Inter" font-size="12" font-weight="600" fill="#5C5C5C" text-anchor="start" letter-spacing="0.5">STEP 2 · PARK UNTIL AFTER PRELIMS</text><text x="36" y="272" font-family="Inter" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">Ethics · 12 units</text><rect x="240" y="254" width="114" height="34" rx="10" fill="#F0F0EC"/><text x="268" y="276" font-family="Inter" font-size="13" font-weight="400" fill="#4A4A4A" text-anchor="middle">Keep</text><rect x="299" y="257" width="52" height="28" rx="8" fill="#FFFFFF"/><text x="325" y="276" font-family="Inter" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Park</text><text x="36" y="306" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">Mains only. Prelims doesn't test it, so it</text><text x="36" y="324" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">waits until after the exam.</text><rect x="36" y="330" width="318" height="1" rx="0" fill="#ECECE8"/><text x="36" y="358" font-family="Inter" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">World History · 11 units</text><rect x="240" y="340" width="114" height="34" rx="10" fill="#F0F0EC"/><text x="268" y="362" font-family="Inter" font-size="13" font-weight="400" fill="#4A4A4A" text-anchor="middle">Keep</text><rect x="299" y="343" width="52" height="28" rx="8" fill="#FFFFFF"/><text x="325" y="362" font-family="Inter" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Park</text><text x="36" y="392" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">Mains only. The next biggest after Ethics.</text><rect x="36" y="416" width="318" height="1" rx="0" fill="#ECECE8"/><g transform="translate(36,428) scale(0.75)" fill="none" stroke="#2E6B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V7z"/></g><text x="62" y="442" font-family="Inter" font-size="13" font-weight="400" fill="#4A4A4A" text-anchor="start">Indian Polity is marked must-finish, so it's</text><text x="62" y="460" font-family="Inter" font-size="13" font-weight="400" fill="#4A4A4A" text-anchor="start">never parked. Only what's needed is parked.</text><rect x="20" y="506" width="350" height="76" rx="16" fill="#E7F1EB"/><text x="36" y="534" font-family="Inter" font-size="16" font-weight="700" fill="#1F4D38" text-anchor="start">This fits: 12 units a week</text><text x="36" y="558" font-family="Inter" font-size="14" font-weight="400" fill="#1F4D38" text-anchor="start">Done before revision, with 30 revision days kept.</text><rect x="20" y="742" width="350" height="52" rx="12" fill="#2E6B4F"/><text x="195.0" y="773.5" font-family="Inter" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Apply this plan</text><text x="195" y="820" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="middle">Parked subjects come back any time from Subjects.</text></svg>