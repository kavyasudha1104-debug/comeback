<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>2. Back after 5 days off</title><rect width="390" height="844" fill="#F7F7F5"/><text x="20" y="44" font-family="Inter" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="start">Thursday, 19 November</text><text x="20" y="80" font-family="Inter" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="start">Welcome back. 5 days</text><text x="20" y="114" font-family="Inter" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="start">off happens to everyone.</text><text x="20" y="150" font-family="Inter" font-size="15" font-weight="400" fill="#4A4A4A" text-anchor="start">Your learning path picks up where you stopped.</text><text x="20" y="172" font-family="Inter" font-size="15" font-weight="400" fill="#4A4A4A" text-anchor="start">Prelims hasn't moved, so here's a lighter start</text><text x="20" y="194" font-family="Inter" font-size="15" font-weight="400" fill="#4A4A4A" text-anchor="start">instead of five days of catch-up.</text><rect x="20" y="224" width="350" height="262" rx="16" fill="#FFFFFF"/><text x="38" y="252" font-family="Inter" font-size="14" font-weight="600" fill="#1A1A1A" text-anchor="start">For today</text><rect x="38" y="270" width="36" height="36" rx="10" fill="#E7F1EB"/><g transform="translate(47,279) scale(0.75)" fill="none" stroke="#2E6B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 9h8M8 13h6"/></g><text x="86" y="285" font-family="Inter" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">One news catch-up read · 60 min</text><text x="86" y="305" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">Instead of 5 days of papers.</text><rect x="38" y="340" width="36" height="36" rx="10" fill="#E7F1EB"/><g transform="translate(47,349) scale(0.75)" fill="none" stroke="#2E6B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11"/></g><text x="86" y="355" font-family="Inter" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">Today's Prelims practice and</text><text x="86" y="375" font-family="Inter" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">Mains answer</text><text x="86" y="395" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">Missed days aren't doubled up.</text><rect x="38" y="410" width="36" height="36" rx="10" fill="#E7F1EB"/><g transform="translate(47,419) scale(0.75)" fill="none" stroke="#2E6B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></g><text x="86" y="425" font-family="Inter" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">Next up: Indian Polity · Unit 21</text><text x="86" y="445" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">Right where you left off.</text><rect x="20" y="500" width="350" height="180" rx="16" fill="#FFFFFF" stroke="#E8C98A" stroke-width="1.5"/><rect x="38" y="518" width="65.6" height="22" rx="11" fill="#FBEFD6"/><text x="48" y="533" font-family="Inter" font-size="11" font-weight="600" fill="#8A5A00" text-anchor="start" letter-spacing="0.5">BEHIND</text><text x="111.6" y="534" font-family="Inter" font-size="14" font-weight="400" fill="#4A4A4A" text-anchor="start">The break moved your finish date</text><text x="38" y="570" font-family="Inter" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="start">At your usual pace you'd finish 21 days</text><text x="38" y="593" font-family="Inter" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="start">after Prelims. There's a plan that fits.</text><rect x="38" y="614" width="314" height="48" rx="12" fill="#2E6B4F"/><text x="195.0" y="643.5" font-family="Inter" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">See the plan</text></svg>