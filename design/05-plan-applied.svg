<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>4. Plan applied</title><rect width="390" height="844" fill="#F7F7F5"/><rect x="20" y="28" width="80.8" height="22" rx="11" fill="#E7F1EB"/><text x="30" y="43" font-family="Inter" font-size="11" font-weight="600" fill="#1F4D38" text-anchor="start" letter-spacing="0.5">ON TRACK</text><text x="20" y="90" font-family="Inter" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="start">You'll finish before</text><text x="20" y="124" font-family="Inter" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="start">revision starts.</text><text x="20" y="150" font-family="Inter" font-size="15" font-weight="400" fill="#4A4A4A" text-anchor="start">Ethics and World History wait until after Prelims.</text><text x="20" y="172" font-family="Inter" font-size="15" font-weight="400" fill="#4A4A4A" text-anchor="start">Everything else stays.</text><rect x="20" y="196" width="350" height="110" rx="16" fill="#FFFFFF"/><text x="38" y="224" font-family="Inter" font-size="14" font-weight="600" fill="#1A1A1A" text-anchor="start">This week</text><text x="352" y="224" font-family="Inter" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="end">0 of 12 units</text><rect x="38" y="240" width="314" height="8" rx="4" fill="#E6E6E1"/><text x="38" y="276" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">About 2 units on each study day. Your 30</text><text x="38" y="294" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">revision days are kept.</text><rect x="20" y="320" width="350" height="140" rx="16" fill="#FFFFFF"/><text x="38" y="350" font-family="Inter" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">How doable does this plan feel?</text><rect x="38" y="368" width="58" height="44" rx="10" fill="#FFFFFF" stroke="#DADAD4" stroke-width="1"/><text x="67" y="396" font-family="Inter" font-size="15" font-weight="400" fill="#1A1A1A" text-anchor="middle">1</text><rect x="102" y="368" width="58" height="44" rx="10" fill="#FFFFFF" stroke="#DADAD4" stroke-width="1"/><text x="131" y="396" font-family="Inter" font-size="15" font-weight="400" fill="#1A1A1A" text-anchor="middle">2</text><rect x="166" y="368" width="58" height="44" rx="10" fill="#FFFFFF" stroke="#DADAD4" stroke-width="1"/><text x="195" y="396" font-family="Inter" font-size="15" font-weight="400" fill="#1A1A1A" text-anchor="middle">3</text><rect x="230" y="368" width="58" height="44" rx="10" fill="#E7F1EB" stroke="#2E6B4F" stroke-width="1.5"/><text x="259" y="396" font-family="Inter" font-size="15" font-weight="600" fill="#1F4D38" text-anchor="middle">4</text><rect x="294" y="368" width="58" height="44" rx="10" fill="#FFFFFF" stroke="#DADAD4" stroke-width="1"/><text x="323" y="396" font-family="Inter" font-size="15" font-weight="400" fill="#1A1A1A" text-anchor="middle">5</text><text x="38" y="438" font-family="Inter" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start">Not doable</text><text x="352" y="438" font-family="Inter" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="end">Very doable</text><rect x="20" y="772" width="350" height="52" rx="12" fill="#2E6B4F"/><text x="195.0" y="803.5" font-family="Inter" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start Indian Polity · Unit 21</text></svg>